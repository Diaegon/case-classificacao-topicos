  5532: "Classificação dos Procedimentos: comum ordinário/sumário/sumaríssimo e especiais, assunto específico"
  5573: "Classificação dos Provimentos Judiciais: despachos, decisões interlocutórias e sentenças, assunto específico"
  5525: "Princípios Constitucionais do Júri: art. 5º, XXXVIII, CF, assunto específico"
