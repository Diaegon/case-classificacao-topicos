# Pares (ou grupos) de temas LEGÍTIMOS que cobrem o mesmo assunto em lugares diferentes da árvore.
# Diferente de duplicata: os dois nós continuam publicáveis (decisão do usuário, 2026-10-17).
# Efeito: o juiz vê o aviso na árvore, e a regra de decisão exige evidência extra
# (ex.: disciplina) antes de publicar num nó com sobreposição, porque escolher o
# lado errado é erro (os nós são irmãos ou primos, não pai/filho).
#
# Origem: "manual" = identificado na leitura da árvore; "similaridade" = proposto pelo
# rapidfuzz (títulos parecidos, ambos com conteúdo próprio) e confirmado na leitura.
# Revisado por: (pendente)

