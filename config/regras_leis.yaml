# Regras de lei (etapa 2, sinal II): citação de lei na questão → tema(s).
# Curadoria desta base. Proposta do Claude a partir da lista inicial do usuário; Revisado por: (pendente).
#
# Uma citação é evidência de que o tema APARECE, não de que é o central (ex.: questão de ANPP que
# cita a Maria da Penha como exceção). Por isso o sinal guarda onde a citação está e quantas vezes.
#
# numeros: número da lei sem ponto. Aceita "Lei nº 11.343/06", "Lei 11343", "L. 11.343", "Lei n. º 11.343".
#          O número sozinho só conta com ponto e ano ("11.343/06"), para não confundir com outros números.
# nomes:   regex (sem distinguir maiúsculas, exceto siglas escritas com \b e em caixa alta via (?-i:...)).
# temas:   ids publicáveis. Duas ids quando a árvore tem o tema em dois ramos (sobreposição).

leis:
